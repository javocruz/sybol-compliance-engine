name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: |
          poetry install --with dev

      - name: Lint & Format
        run: |
          poetry run ruff check --fix src tests || true
          poetry run black src tests

      - name: Type check
        run: |
          cd src && poetry run mypy .

      - name: Test
        env:
          DISABLE_RATE_LIMIT: "1"
        run: |
          poetry run pytest -q --cov=src

      - name: pip-audit (non-blocking)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r <(poetry export -f requirements.txt --without-hashes --only main) || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and test
        run: |
          npm ci
          npm run test
          npm run build

      - name: npm audit (non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high || true
