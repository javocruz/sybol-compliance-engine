[tool.poetry]
name = "sybol-compliance-engine"
version = "0.1.0"
description = "AI compliance engine for media authenticity scoring and verifiable credential issuance"
authors = ["IEU Labs x Sybol"]
readme = "README.md"
packages = [
    { include = "rag", from = "src" },
    { include = "credentials", from = "src" },
    { include = "scoring", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
fastapi = ">=0.110,<1.0"
uvicorn = { version = ">=0.27,<1.0", extras = ["standard"] }
pydantic = ">=2.6,<3.0"
qdrant-client = ">=1.8,<2.0"
llama-index = ">=0.10"
llama-index-embeddings-huggingface = ">=0.2"
llama-index-vector-stores-qdrant = ">=0.2"
llama-index-llms-mistralai = ">=0.2"
llama-index-llms-ollama = ">=0.2"
llama-index-readers-file = ">=0.2"
python-dotenv = ">=1.0,<2.0"
itsdangerous = ">=2.1,<3.0"
mistralai = ">=1.0,<2.0"
sentence-transformers = ">=2.6,<3.0"
transformers = ">=4.40,<5.0"
torch = { version = ">=2.2,<3.0", extras = ["cpu"] }
opencv-python-headless = ">=4.9,<5.0"
exifread = ">=3.0,<4.0"
imagehash = ">=4.3,<5.0"
pillow = ">=10.0,<11.0"
numpy = ">=1.26,<3.0"
scikit-learn = ">=1.4,<2.0"
httpx = ">=0.27,<1.0"
python-multipart = ">=0.0.9,<1.0"
jsonschema = ">=4.21,<5.0"
pymupdf = ">=1.24,<2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
pytest-cov = ">=5.0,<6.0"
pytest-asyncio = ">=0.23,<1.0"
pytest-mock = ">=3.12,<4.0"
hypothesis = ">=6.100,<7.0"
ruff = ">=0.4,<1.0"
black = ">=24.0,<25.0"
mypy = ">=1.8,<2.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/rag/pipeline.py" = ["E402", "F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
